name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check nicovideo-speed-seek-sync.user.js
      - name: Verify userscript metadata
        run: node tests/verify.mjs
